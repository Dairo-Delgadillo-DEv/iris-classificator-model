# bandit.yaml — Configuración de Bandit para el proyecto Iris Classifier
# Formato YAML requerido cuando se usa el flag -c / --configfile

# Excluir directorios que no son código de producción
exclude_dirs:
  - .venv
  - tests
  - notebooks
  - .git
  - __pycache__

# Suprimir checks específicos con justificación documentada:
#
# B101 - assert: Usado únicamente para validación de integridad de datos en carga
#        del dataset (no en rutas de producción que puedan ser desactivadas)
#
# B301/B403 - pickle/joblib: joblib usa pickle internamente para serializar modelos
#             ML. Los archivos .joblib son generados internamente y no se deserializan
#             desde fuentes externas no confiables.
#
# B104 - binding 0.0.0.0: Necesario para que el contenedor Docker sea accesible.
#        La seguridad de red se maneja a nivel de infraestructura (k8s, firewall).

skips:
  - B101
  - B301
  - B403
  - B104
