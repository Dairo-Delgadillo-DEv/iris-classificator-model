version: '3.8'

services:
  mlops-api:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: mlops_api_service
    ports:
      - "5000:5000"
    volumes:
      # Montar directorios para reflejar cambios en tiempo real en desarrollo
      - ../../models:/app/models
      - ../../src:/app/src
      - ../../config:/app/config
      - ../../deployment:/app/deployment
    environment:
      - PYTHONPATH=/app
      - PORT=5000
    restart: unless-stopped
