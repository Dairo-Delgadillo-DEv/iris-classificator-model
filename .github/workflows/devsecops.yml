name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  sast_and_sca:
    name: Code & Dependency Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install "bandit>=1.7.9" "safety>=3.0.0"

    - name: Run Bandit (SAST)
      # Usa bandit.yaml (formato YAML) para configuración de supresiones documentadas.
      # B101=assert, B104=0.0.0.0, B301/B403=joblib/pickle → conocidos y aceptados en ML
      run: |
        echo "Escaneando código Python en busca de vulnerabilidades..."
        bandit -r src/ deployment/api/ -c bandit.yaml -f txt

    - name: Run Safety (SCA)
      # continue-on-error porque Safety puede requerir autenticación para BD completa
      run: |
        echo "Escaneando dependencias en busca de paquetes inseguros..."
        safety scan --file requirements.txt --output text
      continue-on-error: true

  container_security:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t iris-model:latest -f deployment/docker/Dockerfile .

    - name: Install Trivy
      # Instalación directa — evita dependencia de aquasecurity/trivy-action
      # cuya versión interna (setup-trivy) puede no estar disponible en el marketplace
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
        trivy --version

    - name: Run Trivy vulnerability scanner
      run: |
        echo "Escaneando imagen Docker en busca de vulnerabilidades..."
        trivy image \
          --exit-code 0 \
          --ignore-unfixed \
          --vuln-type os,library \
          --severity CRITICAL,HIGH \
          --format table \
          iris-model:latest
