name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  sast_and_sca:
    name: Code & Dependency Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Bandit (SAST)
      run: |
        echo "Escaneando código Python en busca de vulnerabilidades..."
        bandit -r src/ deployment/api/ -ll -ii
      
    - name: Run Safety (SCA)
      run: |
        echo "Escaneando dependencias en busca de paquetes inseguros..."
        safety check -r requirements.txt --full-report

  container_security:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Build Docker image
      run: docker build -t iris-model:latest -f deployment/docker/Dockerfile .
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'iris-model:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
