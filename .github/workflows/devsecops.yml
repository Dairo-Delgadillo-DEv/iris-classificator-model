name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  sast_and_sca:
    name: Code & Dependency Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install "bandit>=1.7.9" "safety>=3.0.0"

    - name: Run Bandit (SAST)
      # Usa el archivo .bandit para configuración de supresiones documentadas
      # --exit-zero -> siempre sale con 0, el reporte se genera pero no falla el pipeline
      run: |
        echo "Escaneando código Python en busca de vulnerabilidades..."
        bandit -r src/ deployment/api/ -c .bandit -f txt

    - name: Run Safety (SCA)
      # continue-on-error porque Safety requiere autenticación para la DB completa
      run: |
        echo "Escaneando dependencias en busca de paquetes inseguros..."
        safety scan --file requirements.txt --output text
      continue-on-error: true

  container_security:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t iris-model:latest -f deployment/docker/Dockerfile .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.28.0
      with:
        image-ref: 'iris-model:latest'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
